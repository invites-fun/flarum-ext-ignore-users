fof-ignore-users:

  ##
  # UNIQUE KEYS - The following keys are used in only one location each.
  ##

  # Translations in this namespace are used by the admin interface.
  admin:
    permissions:
      can_not_be_ignored_label: Can not be ignored
    settings:
      ignored_discussion_default_behavior_label: Default Behavior for Discussions
      ignored_post_default_behavior_label: Default Behavior for Posts
      default_behavior_options:
        label: Label
        hide: Hide
        block: Block
      ignored_notification_default_behavior_label: Default Behavior for Notifications
      notification_behavior_options:
        allow: Allow
        block: Block


  # Translations in this namespace are used by the forum interface.
  forum:

    profile_link: Ignored Users
    profile_page:
      no_ignored: It looks like you're not ignoring anyone.

    # These strings are used in the User Controls menu.
    user_controls:
      ignore_button: Ignore
      ignore_confirmation: Are you sure you want to ignore this user?
      unignore_button: Unignore
      unignore_confirmation: Are you sure you want to unignore this user?
    
    preview:
      ignored_post_preview: "Post from ignored user"

    badge:
      user_label: Ignored user
      discussion_label: Started by an ignored user

    settings:
      settings_heading: "Ignore User Behavior"
      ignored_discussion_default_behavior_label: Discussions
      ignored_discussion_default_behavior_help: How to handle discussions from ignored users
      ignored_post_default_behavior_label: Posts
      ignored_post_default_behavior_help: How to handle posts from ignored users
      default_behavior_options:
        label: "Label"
        hide: "Hide"
        block: "Block"
      ignored_notification_default_behavior_label: Notifications
      ignored_notification_default_behavior_help: How to handle notifications from ignored users
      notification_behavior_options:
        allow: "Allow"
        block: "Block"
